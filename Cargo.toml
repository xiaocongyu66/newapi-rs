[workspace]
members = ["crates/config", "crates/storage", "crates/catalog", "crates/identity", "crates/security", "crates/relay", "crates/billing", "crates/i18n", "apps/server"]
exclude = ["tools/dependency-probe"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util", "timeout", "limit"] }
tower-http = { version = "=0.7.1", features = ["trace", "cors", "request-id", "limit"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = "0.9.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite-bundled", "postgres", "json"] }
# passkey 切片（方案 A）：CI 探针（run 42554243782）已验证 0.6.2 在钉版工具链
# 下可解析可编译。三个 feature 为业务必需：conditional-ui 提供匿名可发现登录
# 仪式（否则 start_discoverable_authentication 不存在）；danger-allow-state-
# serialisation 让仪式状态可序列化进 auth_flows.payload（对应 Go 的
# SessionData JSON）；danger-credential-internals 暴露 Credential 以便从 Go
# 列结构重建凭据做 verify/login。
webauthn-rs = { version = "=0.6.2", default-features = false, features = ["danger-allow-state-serialisation", "danger-credential-internals", "conditional-ui"] }
newapi-config = { path = "crates/config" }
newapi-storage = { path = "crates/storage" }
newapi-catalog = { path = "crates/catalog" }
newapi-security = { path = "crates/security" }
newapi-identity = { path = "crates/identity" }
newapi-i18n = { path = "crates/i18n" }
newapi-billing = { path = "crates/billing" }
