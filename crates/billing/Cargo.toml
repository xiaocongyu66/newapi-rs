[package]
name = "newapi-billing"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
newapi-storage.workspace = true
rand = "=0.8.8"
md5 = "=0.8.1"
tokio = { workspace = true, features = ["time"] }
uuid = "=1.26.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
