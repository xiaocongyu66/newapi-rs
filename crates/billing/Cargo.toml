[package]
name = "newapi-billing"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
newapi-storage.workspace = true
# 计费日志写侧（Go usagedomain.RecordConsumeLog）。
newapi-usage.workspace = true
rand = "=0.8.8"
md5 = "=0.8.1"
# Go common.Sha1（trade_no 引用串）：sha1 0.10.6 已在锁内（identity 同版本）。
sha1 = "=0.10.6"
tokio = { workspace = true, features = ["time"] }
uuid = "=1.26.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
