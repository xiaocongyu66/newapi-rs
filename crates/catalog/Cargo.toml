[package]
name = "newapi-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
newapi-storage = { path = "../storage" }
# 网关 outbox 发布器（Go publish_gateway_config.go 的 PUBLISH 面）；版本与
# identity crate 的 Redis 缓存切片统一锁定。
redis = { version = "=0.32.7", default-features = false, features = ["tokio-comp", "script"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
# 亲和键指纹（feat/log-write-email）：affinityFingerprint 的 SHA1 前 8 位 hex。
sha1 = "=0.10.6"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite-bundled", "postgres", "json"] }
# outbox 发布器轮询循环（Go RunGatewayConfigOutboxPublisher 的 ticker）。
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
