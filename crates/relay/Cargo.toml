[package]
name = "newapi-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Param override `regex_replace` 与 insight 客户端识别的 semver 提取：锁内已有
# 1.13.1（传递依赖），显式引用不引入新版本。
regex = "=1.13.1"
url = "=2.5.8"
sha2 = "=0.10.9"
# Go oracle 用 tiktoken-go/tokenizer v0.6.2 给 OpenAI 文本模型计 token；
# tiktoken-rs 0.12.1 提供同一 cl100k/o200k 词表与 BPE 引擎
# （fancy-regex 0.19 已在锁内，无其他新依赖）。模型路由表按 Go
# tokenizer.go ForModel 逐字移植，不用 tiktoken-rs 自带路由。
tiktoken-rs = { version = "=0.12.1", default-features = false }

[dev-dependencies]
# auto 分组游走改为 RPITIT 异步端口后的契约测试执行器（rt + macros；
# 版本与 workspace 钉版一致，锁内已有）。
tokio = { version = "=1.54.1", features = ["rt"] }
