[package]
name = "newapi-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Param override `regex_replace` 与 insight 客户端识别的 semver 提取：锁内已有
# 1.13.1（传递依赖），显式引用不引入新版本。
regex = "=1.13.1"
url = "=2.5.8"
sha2 = "=0.10.9"

[dev-dependencies]
# auto 分组游走改为 RPITIT 异步端口后的契约测试执行器（rt + macros；
# 版本与 workspace 钉版一致，锁内已有）。
tokio = { version = "=1.54.1", features = ["rt"] }
