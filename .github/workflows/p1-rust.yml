name: P1 Rust workspace

on:
  workflow_dispatch:
    inputs:
      refresh_lock:
        description: 'Refresh root lock remotely; recover and commit artifact, then rerun locked'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'Cargo.*'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'crates/**'
      - 'apps/**'
      - 'tools/dependency-probe/**'
      - 'scripts/ci/p1-*'
      - 'scripts/ci/p2-*'
      - '.github/workflows/**'
      - 'docs/p1-verification.md'
  pull_request:
    paths:
      - 'Cargo.*'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'crates/**'
      - 'apps/**'
      - 'tools/dependency-probe/**'
      - 'scripts/ci/p1-*'
      - 'scripts/ci/p2-*'
      - '.github/workflows/**'
      - 'docs/p1-verification.md'

permissions:
  contents: read

concurrency:
  group: p1-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.99.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  SQLX_OFFLINE: 'true'
  P1_REFRESH_LOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_lock == true }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      pg96: ${{ steps.images.outputs.pg96 }}
      pg17: ${{ steps.images.outputs.pg17 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize evidence
        run: python3 scripts/ci/p1-ci.py init
      - name: Install fixed toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: p1-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: p1-${{ runner.os }}-${{ runner.arch }}-1.99.1-
      - name: Explicitly refresh or retain root lock and export locked metadata
        run: python3 scripts/ci/p1-ci.py prepare
      - name: Verify official registry tags before service jobs
        id: images
        run: python3 scripts/ci/p1-ci.py images
      - name: Seal evidence
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/ci/p1-ci.py finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p1-prepare-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1-evidence/
          if-no-files-found: error
          retention-days: 14

  oracle:
    name: P2 fixed upstream crypto and Origin oracles
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize exact revision evidence
        run: python3 scripts/ci/p1-ci.py init
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: xiaocongyu66/new-api
          ref: 17970da4571e81308f176a0e61a38276e5771606
          persist-credentials: false
          path: upstream-reference
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: upstream-reference/apps/api/go.mod
          cache: true
          cache-dependency-path: |
            upstream-reference/apps/api/go.sum
            upstream-reference/apps/api/modules/relaykit/go.sum
      - name: Execute both real Go oracles once
        run: python3 scripts/ci/p1-ci.py p2-oracle
      - name: Seal oracle evidence even on failure
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/ci/p1-ci.py finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p2-oracle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1-evidence/
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: [prepare, oracle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: pg96
            image: ${{ needs.prepare.outputs.pg96 }}
            major: '9.6'
          - database: pg17
            image: ${{ needs.prepare.outputs.pg17 }}
            major: '17'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: p1_test
          POSTGRES_PASSWORD: p1_ephemeral_only
          POSTGRES_DB: p1_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U p1_test -d p1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      P1_DATABASE: ${{ matrix.database }}
      P1_POSTGRES_MAJOR: ${{ matrix.major }}
      P1_POSTGRES_IMAGE: ${{ matrix.image }}
      P1_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize evidence and mask temporary credentials
        run: python3 scripts/ci/p1-ci.py init
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p1-prepare-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1-prepare
      - name: Restore exactly the prepared lock
        run: python3 scripts/ci/p1-ci.py restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2-oracle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2-oracle
      - name: Validate Go fixtures and export Rust oracle paths
        run: python3 scripts/ci/p1-ci.py p2-restore-oracle
      - name: Install fixed toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: p1-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: p1-${{ runner.os }}-${{ runner.arch }}-1.99.1-
      - name: Check, format, lint and test both real database backends
        env:
          P1_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          TEST_POSTGRES_DSN: postgres://p1_test:p1_ephemeral_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/p1_test
        run: python3 scripts/ci/p1-ci.py verify
      - name: Seal evidence even on failure
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/ci/p1-ci.py finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p1-${{ matrix.database }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1-evidence/
          if-no-files-found: error
          retention-days: 14

  process:
    name: Fixed Go oracle and Rust process differential
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize exact revision evidence
        run: python3 scripts/ci/p1-ci.py init
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: xiaocongyu66/new-api
          ref: 17970da4571e81308f176a0e61a38276e5771606
          persist-credentials: false
          path: upstream-reference
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: upstream-reference/apps/api/go.mod
          cache: true
          cache-dependency-path: |
            upstream-reference/apps/api/go.sum
            upstream-reference/apps/api/modules/relaykit/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p1-prepare-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1-prepare
      - name: Restore prepared lock with identity and checksum validation
        run: python3 scripts/ci/p1-ci.py restore
      - name: Install fixed Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: p1-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: p1-${{ runner.os }}-${{ runner.arch }}-1.99.1-
      - name: Execute real upstream handlers and export JSON oracle
        run: python3 scripts/ci/p1-process.py oracle
      - name: Build and test real Rust processes against Go oracle
        run: python3 scripts/ci/p1-process.py smoke
      - name: Seal process evidence even on failure
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/ci/p1-ci.py finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p1-process-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1-evidence/
          if-no-files-found: error
          retention-days: 14
